<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Κατάσταση pool — Θεμέλιο (Admin)</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; max-width:820px; margin:40px auto; padding:0 20px; color:#2B2640; background:#FFF7E6;}
  h1{color:#282357; font-size:1.4rem;}
  .card{background:#fff; border-radius:16px; padding:24px; box-shadow:0 6px 16px rgba(40,35,87,0.08); margin-bottom:20px;}
  label{display:block; font-weight:600; margin:14px 0 6px; font-size:0.92rem;}
  input[type=password], input[type=text]{
    width:100%; padding:10px 12px; border-radius:10px; border:2px solid #E7E2F5; font-size:0.95rem; box-sizing:border-box;
  }
  button{
    background:#F69401; color:#fff; border:none; font-weight:700; padding:10px 20px;
    border-radius:999px; cursor:pointer; font-size:0.9rem; margin-top:12px; margin-right:8px;
  }
  button.secondary{background:#282357;}
  button:hover{opacity:0.9;}
  .stat{display:inline-block; margin-right:26px; margin-bottom:10px;}
  .stat b{display:block; font-size:1.5rem; color:#282357;}
  .stat span{font-size:0.8rem; color:#726C88;}
  #msg{font-size:0.88rem; margin-top:8px;}
</style>
</head>
<body>

<h1>📊 Κατάσταση pool — Θεμέλιο</h1>

<div class="card">
  <label for="secret">Admin secret</label>
  <input type="password" id="secret" autocomplete="off">
  <button id="loadBtn">Φόρτωση κατάστασης</button>
  <button class="secondary" id="exportBtn">Εξαγωγή CSV (παραχωρημένοι)</button>
  <div id="msg"></div>
</div>

<div id="statsArea"></div>

<div class="card">
  <h3 style="margin-top:0;">Χειροκίνητη επαναφορά λογαριασμού</h3>
  <label for="resetUsername">Username προς επαναφορά</label>
  <input type="text" id="resetUsername" placeholder="π.χ. orientum-247068">
  <button id="resetBtn">Επαναφορά σε available</button>
  <div id="resetMsg"></div>
</div>

<script>
  function getSecret(){ return document.getElementById('secret').value.trim(); }

  document.getElementById('loadBtn').addEventListener('click', async () => {
    const secret = getSecret();
    const msg = document.getElementById('msg');
    if (!secret) { msg.textContent = 'Βάλε το admin secret.'; return; }
    msg.textContent = 'Φόρτωση…';

    try {
      const res = await fetch('/.netlify/functions/admin-status', {
        headers: { 'x-admin-secret': secret }
      });
      const data = await res.json();
      if (!data.ok) { msg.textContent = 'Σφάλμα: ' + (data.error || 'άγνωστο'); return; }
      msg.textContent = '';
      renderStats(data.summary);
    } catch (err) {
      msg.textContent = 'Πρόβλημα σύνδεσης: ' + err.message;
    }
  });

  function renderStats(summary){
    const area = document.getElementById('statsArea');
    area.innerHTML = Object.keys(summary).map(pool => {
      const s = summary[pool];
      return `<div class="card">
        <div class="stat"><b>${s.totalImported}</b><span>Σύνολο εισαγμένων</span></div>
        <div class="stat"><b>${s.claimed}</b><span>Παραχωρημένοι</span></div>
        <div class="stat"><b>${s.available}</b><span>Διαθέσιμοι</span></div>
      </div>`;
    }).join('');
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const secret = getSecret();
    if (!secret) { document.getElementById('msg').textContent = 'Βάλε το admin secret.'; return; }
    window.open('/.netlify/functions/admin-status?format=csv&secret=' + encodeURIComponent(secret), '_blank');
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const secret = getSecret();
    const username = document.getElementById('resetUsername').value.trim();
    const resetMsg = document.getElementById('resetMsg');
    if (!secret || !username) { resetMsg.textContent = 'Χρειάζεται admin secret και username.'; return; }

    resetMsg.textContent = 'Γίνεται επαναφορά…';
    try {
      const res = await fetch('/.netlify/functions/admin-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      resetMsg.textContent = data.ok ? ('✅ ' + (data.message || 'Έγινε.')) : ('❌ ' + (data.error || 'Σφάλμα'));
    } catch (err) {
      resetMsg.textContent = '❌ Πρόβλημα σύνδεσης: ' + err.message;
    }
  });
</script>

</body>
</html>
